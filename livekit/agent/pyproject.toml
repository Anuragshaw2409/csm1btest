[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csm-livekit-agent"
version = "1.0.0"
description = "Customer support voice agent (Silero VAD + LiveKit multilingual turn-detector -> LiveKit Inference STT/LLM/TTS) on LiveKit Agents"
requires-python = ">=3.10"

dependencies = [
    "livekit-agents[silero,turn-detector]~=1.6",
    "livekit-plugins-ai-coustics~=0.3",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
